services:
  postgres:
    image: postgres:16
    container_name: csstudy-postgres
    environment:
      POSTGRES_USER: csstudy
      POSTGRES_PASSWORD: csstudy1234
      POSTGRES_DB: csstudy
    ports:
      - "5433:5432"   # 호스트 5432 가 자주 쓰임 (다른 postgres / wefin 등 충돌) → 호스트 5433 으로 분리
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csstudy -d csstudy"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: csstudy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
