# H2 인메모리 — JPA 학습용 (Redis 는 분산 캐시만)
spring.datasource.url=jdbc:h2:mem:cache;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Redis — Stage2_4 부터 사용. docker compose up -d 로 띄우기
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 같은 패키지 (stage.s2 등) 안 여러 main 클래스 각자 @Bean cacheManager() 정의 →
# 부팅 시 ComponentScan 이 둘 다 잡아 "BeanDefinitionOverrideException: cacheManager"
# (직접 검증: 옵션 빼면 Stage2_1 + Stage2_2 양쪽 cacheManager 충돌로 부팅 실패).
# 학습 환경에서 override 허용으로 우회.
spring.main.allow-bean-definition-overriding=true
