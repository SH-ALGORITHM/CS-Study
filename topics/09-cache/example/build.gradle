// 9주차 example — Spring Cache + Caffeine + Redis (Product 도메인)

plugins {
    id 'java'
    id 'application'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.2.0'

    // Spring Cache 추상
    implementation 'org.springframework.boot:spring-boot-starter-cache:3.2.0'

    // 로컬 캐시
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // 분산 캐시 (Stage2-4 ~ 부터 사용)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.2.0'

    // 학습 편의 — H2 (JPA), Redis 만 docker
    runtimeOnly 'com.h2database:h2:2.2.224'
}

application {
    mainClass = providers.gradleProperty('mainClass').orElse('stage.s1.Stage1_1_NoCache')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
