services:
  postgres:
    image: postgres:16-alpine
    container_name: cs-study-08-pg
    environment:
      POSTGRES_DB: index_study
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
