spring.application.name=cs-study-12
server.port=8080

spring.main.banner-mode=off

# 같은 패키지 (app) 의 여러 main 클래스가 각자 @Bean timedAspect() 정의 →
# 한 main 부팅 시 ComponentScan 이 다른 main 까지 잡아 충돌.
# (직접 검증: 옵션 빼면 "BeanDefinitionOverrideException: timedAspect" 재현)
# 학습 환경 override 허용 (9 주차 패턴).
spring.main.allow-bean-definition-overriding=true

# Actuator — 학습용 전부 노출 (운영은 인증 필수 — 11 주차 회수)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# HTTP request Timer 의 백분위 자동 (p50/p95/p99)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Tracing — STAGE 4 (학습용 100%)
management.tracing.sampling.probability=1.0

# 로그 패턴 — traceId / spanId 자동
logging.pattern.level=%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]
