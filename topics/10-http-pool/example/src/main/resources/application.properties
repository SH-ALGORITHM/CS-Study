# 빈 — 각 main 클래스가 자체적으로 server.port 등 결정
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true

# Resilience4j (Stage4 만 사용) — failure-rate 시연만. slow-call 시연은 별 stage 가 필요해 제외
resilience4j.circuitbreaker.instances.slowapi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.slowapi.sliding-window-size=10
resilience4j.circuitbreaker.instances.slowapi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.slowapi.wait-duration-in-open-state=5s
# HALF_OPEN 에서 N 회만 시도 ("간보기"). 기본 10. 결과 성공률 → CLOSED / OPEN
resilience4j.circuitbreaker.instances.slowapi.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.slowapi.register-health-indicator=false
