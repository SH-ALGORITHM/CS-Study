// 4주차 학습용 — Java 21 + Spring Context (Spring Boot X)
// 결제 PG 도메인 (sysout 시뮬레이션) — DB / Web / Redis 안 씀

plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = providers.gradleProperty('mainClass').orElse('stage.Stage2Layering')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-context:6.1.0'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'   // @PostConstruct / @PreDestroy
}
