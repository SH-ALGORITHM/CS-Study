// 5주차 example — Spring Proxy / AOP 학습용
// 외부 의존성: Spring Boot 3.x (Spring 6.x 포함) + spring-boot-starter-aop + H2 (인메모리 DB)

plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 3.x — Spring Framework 6.1.x (≥ 5.2.7 advice 순서 적용)
    implementation 'org.springframework.boot:spring-boot-starter:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc:3.2.0'

    // H2 인메모리 DB — STAGE 2-1 ThreadLocal 검증용
    runtimeOnly 'com.h2database:h2:2.2.224'
}

application {
    mainClass = providers.gradleProperty('mainClass').orElse('stage.s1.Stage1JdkProxy')
}

// -parameters: AspectJ 어노테이션 파라미터 바인딩 (@annotation(audited) + Audited audited) 안전장치.
// Spring 6.1+ 부터 디버그 정보 기반 파라미터명 추론이 deprecated 라서 명시 권장.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
