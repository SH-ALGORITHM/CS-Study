// 5주차 학습 — 분산락 AOP (@DistributedLock 한 줄로 SETNX/Lua/finally 추출)
// 3주차 P2P 송금 도메인 (PostgreSQL + Redis) 재사용 + Spring Boot AOP

plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc:3.2.0'

    // 3주차 인프라 그대로
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'io.lettuce:lettuce-core:6.3.0.RELEASE'
}

application {
    mainClass = providers.gradleProperty('mainClass').orElse('stage.Stage1Before')
}

// -parameters: AspectJ 어노테이션 파라미터 바인딩 + SpEL 안전장치 (Spring 6.1+)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
