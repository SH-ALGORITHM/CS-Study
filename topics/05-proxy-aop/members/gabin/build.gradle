// 5주차 학습용 — Spring Boot 3.x + AOP / 도메인은 학습자가 선택
// 가벼운 도메인 (감사 로그 / 재시도) 면 JDBC / H2 제거. 트랜잭션 자작 / 분산락 AOP 면 유지.

plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // STAGE 2 @MyTransactional / ThreadLocal 검증용:
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.postgresql:postgresql'
}

application {
    mainClass = providers.gradleProperty('mainClass').orElse('stage.Stage1')
}

// -parameters: AspectJ 어노테이션 파라미터 바인딩 안전장치 (Spring 6.1+)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
