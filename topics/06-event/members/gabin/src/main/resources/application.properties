# H2 인메모리 DB — STAGE 2 (트랜잭션 + @TransactionalEventListener) 검증용
spring.datasource.url=jdbc:h2:mem:event-study;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 부팅 시 스키마 자동 생성
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Hikari 풀 크기 — 작게 (학습용)
spring.datasource.hikari.maximum-pool-size=5

# Spring AOP 기본 = CGLIB (Spring Boot 2.0+) — STAGE 4 비교
spring.aop.proxy-target-class=true

# STAGE 3-5 — Virtual Thread (Java 21 + Spring Boot 3.2)
# 켜면 applicationTaskExecutor 가 가상 스레드 기반 SimpleAsyncTaskExecutor 로 자동 교체.
# 단 Stage3_2 처럼 @Bean(name="applicationTaskExecutor") 로 ThreadPoolTaskExecutor 등록한
# stage 에서는 자동 설정이 덮어써져서 가상 스레드 안 켜짐.
spring.threads.virtual.enabled=true

# 콘솔 출력 색상 / 너비 조정 안 함 — println 순서 그대로 보기
