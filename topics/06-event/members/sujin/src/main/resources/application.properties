# 6주차 STAGE 2 — 트랜잭션 결합용 H2 인메모리 datasource
# starter-jdbc + h2 가 classpath 에 있으면 DataSourceTransactionManager 자동 등록
# → @Transactional 바로 동작 (@EnableTransactionManagement 불필요, Boot 가 자동)

spring.datasource.url=jdbc:h2:mem:payment;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql 을 시작 시 항상 실행 (테이블 생성)
spring.sql.init.mode=always

# 콘솔 앱 — println 관찰이 핵심이라 배너/로그 소음 제거
spring.main.banner-mode=off
logging.level.root=WARN

# commit/rollback 을 프레임워크 로그로 직접 보고 싶으면 아래 주석 해제
# logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG
