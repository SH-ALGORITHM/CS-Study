plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop:3.2.0'

    implementation 'org.springframework.boot:spring-boot-starter-jdbc:3.2.0'
    runtimeOnly 'com.h2database:h2:2.2.224'
}

application {
    mainClass = providers.gradleProperty('mainClass').orElse('stage.Stage1')
}

// -parameters: AspectJ 어노테이션 파라미터 바인딩 안전장치 (Spring 6.1+)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
